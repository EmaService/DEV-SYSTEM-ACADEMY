<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEV SYSTEM | Examen de admisión</title>
    <meta name="description" content="Examen técnico de admisión de DEV SYSTEM." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="platform-config.js"></script>
    <script defer src="cloud-state.js"></script>
    <script defer src="app-state.js"></script>
    <script defer src="examen.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand"><img src="logo.png" alt="DEV SYSTEM Academy" class="brand-logo"></a>
        <nav class="nav">
          <a href="portal.html">Mi portal</a>
          <a href="login.html">Acceso</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container auth-wrap">
        <section class="card auth-card reveal">
          <p class="eyebrow">Examen de admisión</p>
          <h1 id="exam-title" class="page-title">Examen técnico de admisión</h1>
          <p id="exam-description" class="lead">
            Responde las 15 preguntas. Deberás obtener al menos 70 puntos para aprobar.
          </p>

          <div id="exam-content">
            <div class="progress-bar" style="margin-top:1.2rem">
              <div id="exam-progress-fill" class="progress-fill" style="width:0%"></div>
            </div>
            <p id="exam-counter" class="small" style="margin-top:0.5rem;text-align:right;color:var(--muted)">Pregunta 1 de 15</p>

            <div id="question-container" style="margin-top:1.2rem">
              <p id="question-text" style="font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:1rem"></p>
              <div id="options-container" class="plan-grid"></div>
            </div>

            <div style="margin-top:1.2rem;display:flex;gap:0.75rem">
              <button id="prev-btn" class="btn btn-ghost" style="flex:1" disabled>Anterior</button>
              <button id="next-btn" class="btn" style="flex:1">Siguiente</button>
            </div>
            <button id="submit-btn" class="btn btn-block" style="display:none">Entregar examen</button>
          </div>

          <div id="exam-result" style="display:none;margin-top:1.2rem">
            <p id="result-message" class="notice" style="font-size:1.1rem;text-align:center"></p>
            <p id="result-score" class="lead" style="text-align:center;margin-top:0.5rem"></p>
            <p id="result-price" class="small" style="text-align:center;margin-top:0.8rem;color:var(--green)"></p>
            <a id="result-cta" class="btn btn-block" href="portal.html" style="margin-top:1rem">Ir a mi portal</a>
          </div>

          <p id="exam-message" class="notice" aria-live="polite"></p>
        </section>
      </div>
    </main>
  </body>
</html>
