<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
    <title>DEV SYSTEM | Lección</title>
    <meta name="description" content="Visor de lecciones de DEV SYSTEM." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="platform-config.js"></script>
    <script defer src="cloud-state.js"></script>
    <script defer src="app-state.js"></script>
    <script defer src="lecciones-data.js"></script>
    <script defer src="glosario-data.js"></script>
    <script defer src="leccion.js"></script>
  </head>
  <body class="leccion-body">
    <header id="leccion-sticky-header" class="leccion-sticky">
      <button id="leccion-back-btn" class="btn btn-ghost btn-sm" onclick="if (confirm('¿Salir de la lección? El progreso se guarda automáticamente.')) history.back()">✕</button>
      <div class="progress-bar" style="flex:1;margin:0 1rem">
        <div id="leccion-header-progress" class="progress-fill" style="width:0%"></div>
      </div>
      <span id="leccion-xp-chip" class="xp-chip">⭐ 0 XP</span>
    </header>

    <main class="section">
      <div class="container portal-layout">
        <section id="lectura-section" class="lectura-carousel reveal" style="position:relative">
          <div class="carousel-track">
            <p class="eyebrow" id="leccion-materia"></p>
            <h1 id="leccion-titulo" class="page-title"></h1>
            <div id="leccion-secciones" class="carousel-slides"></div>
          </div>
          <div id="carousel-dots" class="carousel-dots"></div>
          <button id="carousel-next-btn" class="btn carousel-btn">Siguiente →</button>
          <button id="start-ejercicios-btn" class="btn btn-brand carousel-btn" style="display:none">Comenzar ejercicios ▶</button>
        </section>

        <section id="ejercicios-section" class="ej-fullscreen" style="display:none">
          <div class="ej-header">
            <h2 id="ejercicios-titulo" style="font-size:1.1rem">Ejercicios</h2>
            <div class="progress-bar" style="flex:1;margin:0 1rem">
              <div id="ej-progress-fill" class="progress-fill" style="width:0%"></div>
            </div>
            <span id="ej-counter" class="small" style="color:var(--muted);white-space:nowrap"></span>
          </div>
          <div class="ej-stage">
            <div id="ej-container"></div>
            <div id="ej-feedback" class="ej-feedback"></div>
          </div>
        </section>

        <section id="completada-section" class="celebration-screen" style="display:none">
          <div class="confetti-container" id="confetti-container"></div>
          <div class="celebration-content">
            <span class="celebration-badge">🎉</span>
            <h2 class="page-title" style="color:var(--green);font-size:clamp(1.5rem,4vw,2rem)">¡Lección completada!</h2>
            <span id="completada-xp-chip" class="xp-chip xp-chip-lg" style="margin-top:1rem;display:inline-block">⭐ +10 XP</span>
            <p id="completada-stats" class="lead" style="margin-top:1rem"></p>
            <div style="margin-top:1.5rem;display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center">
              <a id="next-lesson-btn" class="btn btn-brand" style="flex:1;max-width:300px">Siguiente lección</a>
              <a href="portal.html" class="btn btn-ghost" style="flex:1;max-width:300px">Volver al portal</a>
            </div>
          </div>
        </section>

        <div id="glosario-toast" style="display:none;position:fixed;bottom:1rem;right:1rem;max-width:400px;background:var(--bg-card);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:1rem;z-index:999;box-shadow:var(--shadow)"></div>
      </div>
    </main>
  </body>
</html>
